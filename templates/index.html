<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Trainer Agent</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            text-align:center;
            padding:40px;
        }

        .container{
            background:white;
            width:70%;
            margin:auto;
            padding:30px;
            border-radius:12px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        input, textarea, select{
            width:80%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:12px 25px;
            font-size:16px;
            cursor:pointer;
        }

        ol{
            text-align:left;
        }

        .feedback{
            margin-top:20px;
            padding:15px;
            background:#eef7ee;
            border-radius:10px;
            text-align:left;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>AI Interview Trainer Agent</h1>

    <form method="POST">

        <input type="text"
               name="role"
               placeholder="Enter Job Role"
               required>

        <br>

        <input type="text"
               name="skills"
               placeholder="Enter Skills"
               required>

        <br>

        <select name="interview_type" required>
            <option value="">Select Interview Type</option>
            <option value="HR">HR Interview</option>
            <option value="Technical">Technical Interview</option>
            <option value="Behavioral">Behavioral Interview</option>
        </select>

        <br>

        <textarea
            name="answer"
            rows="6"
            placeholder="Enter your interview answer here">
        </textarea>

        <br>

        <button type="submit">
            Generate & Evaluate
        </button>

    </form>

    {% if questions %}

        <h2>Generated Interview Questions</h2>

        <ol>
            {% for q in questions %}
                <li>{{ q }}</li>
            {% endfor %}
        </ol>

    {% endif %}

    {% if feedback %}

        <div class="feedback">

            <h2>AI Feedback</h2>

            <pre>{{ feedback }}</pre>

        </div>

    {% endif %}

    {% if report %}

        <div class="feedback">

            <h2>Performance Report</h2>

            <pre>{{ report }}</pre>

        </div>

    {% endif %}

</div>

</body>
</html>
