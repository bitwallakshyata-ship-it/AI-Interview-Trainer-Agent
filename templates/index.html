<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Trainer Agent</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            text-align:center;
            padding:40px;
        }

        .container{
            background:white;
            width:60%;
            margin:auto;
            padding:30px;
            border-radius:12px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        input{
            width:80%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:12px 25px;
            font-size:16px;
            cursor:pointer;
        }

        ol{
            text-align:left;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>AI Interview Trainer Agent</h1>

    <form method="POST">

        <input type="text"
               name="role"
               placeholder="Enter Job Role"
               required>

        <br>

        <input type="text"
               name="skills"
               placeholder="Enter Skills"
               required>

        <br>

        <button type="submit">
            Generate Questions
        </button>

    </form>

    {% if questions %}

        <h2>Generated Interview Questions</h2>

        <ol>
            {% for q in questions %}
                <li>{{ q }}</li>
            {% endfor %}
        </ol>

    {% endif %}

</div>

</body>
</html>
